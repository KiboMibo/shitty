# Pretty example configuration.
#
# Copy this file to $XDG_CONFIG_HOME/pretty/pretty.toml or, when
# XDG_CONFIG_HOME is unset, to ~/.config/pretty/pretty.toml. Alternatively,
# pass its path with `pt -config /path/to/pretty.toml`.
#
# All settings are top-level TOML keys. Command-line values override this
# file. Boolean command-line options use `-name` to enable and `+name` to
# disable them. The `CLI:` lines below document every public command-line
# option; options marked "command line only" cannot be used as TOML keys.

# CLI: -altScroll / +altScroll — Send wheel input as arrow keys on the alternate screen.
altScroll = false

# CLI: -autoCopy / +autoCopy — Copy the primary selection to the clipboard automatically.
autoCopy = false

# CLI: -backgroundBlur / +backgroundBlur — Blur what shows through a translucent background.
# Does nothing while backgroundOpacity is 100: an opaque background hides
# the blurred backdrop completely, so none is created. macOS only.
backgroundBlur = false

# CLI: -backgroundOpacity PERCENT — Set how opaque the terminal background is, from 0 to 100.
# 100, the default, is the solid window this terminal has always drawn.
# Only the background goes translucent - text, the cursor, a selection
# and the pane divider stay solid. Applied to the window when it is
# created: turning it on in a running terminal needs a restart, while
# changing it on a window that already started translucent takes effect
# on the next config reload. macOS only: the Vulkan backend leaves the
# background solid at every value, see "Known limits" in the README.
backgroundOpacity = 100

# CLI: -bg COLOR — Set the default background to a three- or six-digit RGB color.
bg = "#2e3440"

# CLI: -boldColors / +boldColors — Use bright palette colors for bold text.
# Off by default: a themed palette expects bold to change only the
# weight, and the bright row often diverges from its normal partner.
boldColors = false

# CLI: -border PIXELS — Set the empty border around the terminal grid, from 0 to 3000 pixels.
border = 2

# CLI: -config PATH — Load PATH instead of the default config file; command line only.

# import — Load other configuration files first, then apply this file's
# own keys on top; later imports override earlier ones. ~/ expands to the
# home directory, a relative path is taken from the importing file.
# import = ["themes/seoul256_light.toml"]

# CLI: -colorScheme NAME — Use a built-in terminal color scheme as the base for foreground, background, and ANSI colors 0 through 15.
# Run `pt -listColorSchemes` to print all available names. The built-in
# "default" is Retro Legends on pure black; "classic" restores the xterm
# look. Explicit fg, bg, and colorN values at the same or higher-priority
# source override the scheme.
# colorScheme = "3024 Night"

# CLI: -cr COLOR — Set the cursor RGB color; omit the key to use the foreground color.
cr = "#88c0d0"

# CLI: -dump PATH — Write raw PTY input to PATH; normally omitted.
# dump = "/tmp/pretty.pty"

# CLI: -fg COLOR — Set the default foreground to a three- or six-digit RGB color.
fg = "#d8dee9"

# CLI: -font FAMILY — Set the font family or file; repeat on the CLI or use a list for fallbacks.
font = ["monospace"]

# CLI: -fontsize SIZE — Set the font size from 1 to 255; PRETTY_FONT_SIZE is the environment fallback.
fontsize = 15

# CLI: -soft LEVEL — Unhinted rendering with subpixel placement; 0..100 scales the stem darkening, -1 keeps the hinted grid.
#soft = 40

# CLI: -geometry COLSxROWS — Set the initial terminal grid size.
geometry = "80x24"

# CLI: -kittyCtrlBaseLayout / +kittyCtrlBaseLayout — Report the ASCII base key as Kitty's primary key under Ctrl.
kittyCtrlBaseLayout = false

# CLI: -vulkanInfo / +vulkanInfo — Print Vulkan device information; command line only.

# CLI: -help — Print the main option list and exit; command line only.

# CLI: -listres — Print the advanced option list and exit; command line only.

# CLI: -listColorSchemes — Print all built-in terminal color scheme names and exit; command line only.

# CLI: -login / +login — Start the selected shell as a login shell.
login = false

# CLI: -maximized / +maximized — Start with the window maximized.
maximized = false

# CLI: -fullscreen / +fullscreen — Start with the window fullscreen.
# Fullscreen wins when both this and maximized are set.
fullscreen = false

# CLI: -naturalEditing / +naturalEditing — Bind the macOS natural text editing chords: Option arrows move by word, Command arrows to the line ends, Option/Command Backspace erase the word or line. Off by default: the Command arrows stay reserved for tab navigation.
naturalEditing = false

# CLI: -no-decorations / +no-decorations — Disable or enable native window decorations.
no-decorations = false

# CLI: -quick / +quick — Run as a quick-terminal window: hidden at startup, shown and hidden by the quickHotkey chord instead of appearing on launch.
quick = false

# CLI: -quickHotkey CHORD — Set the global chord that shows and hides the quick-terminal window when quick is enabled.
quickHotkey = "ctrl+grave"

# CLI: -quickGeometry <W>x<H>+<X>+<Y> — Set the quick-terminal window's size and position; each of W, H, X, Y is pixels or a percent of the screen's usable area, and X/Y offset from its top-left corner.
quickGeometry = "100%x40%+0+0"

# CLI: -quickCompanion PATH — Set a config file for a quick-terminal companion process this one spawns and manages; ignored when quick is true.
# A normal terminal started with this set also spawns PATH's own quick
# window as a second process, and kills it again on exit. PATH would
# typically import this file to inherit its colors and fonts, and set
# quick = true - but must not also set quickCompanion itself, since that
# would try to spawn a companion of its own; quick = true always skips
# it, precisely to make that safe.
# quickCompanion = "~/.config/pretty/quick.toml"

# CLI: -quickCornerRadius POINTS — Set the quick-terminal window's corner radius in points; 0 disables rounding.
quickCornerRadius = 0

# CLI: -quickRememberFrame / +quickRememberFrame — Remember the quick-terminal window's manually set position and size across shows.
# State is kept beside the config file actually in use and named after
# it: this file saves into pretty-quick-frame, while -config myconf.toml
# saves into myconf-quick-frame, each in its own directory. Delete that
# file to forget the saved frame and fall back to quickGeometry; a file
# left by an older build is ignored the same way, the frame now being
# stored in points rather than pixels.
quickRememberFrame = false

# CLI: -quickFullscreenHotkey CHORD — Set the chord that toggles quick-terminal window fullscreen; empty disables it.
# quickFullscreenHotkey = "cmd+f"

# CLI: -tabBar top|sidebar — Choose where the tab bar lives: a strip along the top, or
# a vertical list down the window's right edge.
tabBar = "top"

# CLI: -sidebarColor COLOR — Set the sidebar tab list's color. Unset, the panel is a
# shade off the terminal background and follows it through a theme change, which is
# why there is no default written here. Every other shade in the panel - the
# separator, the active and hovered rows, the text - is mixed from this color, so the
# panel stays consistent with itself. On a translucent window a color close to the
# background stays as see-through as the terminal; one far from it necessarily
# covers more of what shows through.
# sidebarColor = "#363c4a"

# CLI: -sidebarWidth POINTS — Set the sidebar tab list's width in points.
sidebarWidth = 220

# CLI: -autoHideChrome / +autoHideChrome — Hide the titlebar chrome and reveal it on mouse hover.
autoHideChrome = false

# CLI: -panes / +panes — Allow splitting a tab's terminal into multiple panes.
panes = false

# CLI: -paneDividerWidth PIXELS — Set the thickness of the seam between panes, from 0
# to 3000 pixels. The seam is painted into the air the panes' own borders already
# leave, so it is clamped to twice `border` and is invisible when `border` is 0.
paneDividerWidth = 1

# CLI: -paneDividerColor COLOR — Set the seam's color. Unset, it follows the color
# scheme's bright black, so a light scheme gets a light seam. Needs `border` above 0
# to have anywhere to paint.
# paneDividerColor = "#555753"

# CLI: -remap FROM=TO — Rewrite a key chord into another one; repeat the flag for more rules.
# A chord is modifiers (ctrl, alt, shift, super) joined with + around one
# character or a named key (enter, f5, pageup, ...); the target none
# swallows the chord.
# remap = ["ctrl+b=ctrl+d", "ctrl+l=none"]

# CLI: -rv / +rv — Swap the foreground and background colors at startup.
rv = false

# CLI: -saveLines LINES — Keep this many scrollback lines, from 0 to 50000.
saveLines = 500

# CLI: -shell PATH — Use PATH as the shell when no command is provided; normally inherited from SHELL.
# shell = "/bin/sh"

# CLI: -showWraps / +showWraps — Show a marker at the right edge of soft-wrapped lines.
showWraps = false

# CLI: -title TEXT — Set the initial window title.
title = "Pretty"

# CLI: -transparentTitlebar / +transparentTitlebar — Make the titlebar's color match the terminal background.
transparentTitlebar = false

# CLI: -unicodeWidths VERSION — Emulate this Unicode major version's character
# widths. The default 0 probes the system libc and matches it, so local shells
# measure their lines the same way the terminal draws them; pin a version when
# the shell at the far end of an ssh session disagrees (8 predates the emoji
# widths, 15 predates the trigram widths, 17 is the full current tables).
unicodeWidths = 0

# CLI: -uriScheme SCHEME — Treat a detected plain URI with this scheme as openable; repeat the flag for more.
# The default list is http, https, file; a configured list replaces it
# outright, so repeat the defaults if you only mean to extend them.
# Explicit OSC 8 hyperlinks ignore this list. To enumerate the schemes
# your desktop actually handles:
#   grep -ho 'x-scheme-handler/[a-z0-9.+-]*' \
#     /usr/share/applications/mimeinfo.cache \
#     ~/.local/share/applications/mimeinfo.cache 2>/dev/null | sort -u | cut -d/ -f2
# uriScheme = ["http", "https", "file", "mailto", "gemini"]

# CLI: -verbose / +verbose — Print informational diagnostics.
verbose = false

# CLI: -version / -v — Print the version and exit; command line only.

# CLI: -e COMMAND... — Stop option parsing and run COMMAND with the remaining arguments; command line only.


# Advanced terminal, clipboard, window-policy, and palette options.

# CLI: -altSendsEscape BOOL — Prefix Alt-modified keys with Escape when true.
altSendsEscape = true

# CLI: -modifyOtherKeys LEVEL — Select xterm modifyOtherKeys level 0, 1, or 2.
modifyOtherKeys = 1

# CLI: -allowOsc52Read BOOL — Allow applications to read local selections through OSC 52.
allowOsc52Read = false

# CLI: -allowWindowOps BOOL — Allow applications to manipulate and query the host window.
allowWindowOps = false

# CLI: -osc52Select NAME — Use "primary" or "clipboard" for OSC 52 selector `s`.
osc52Select = "primary"

# CLI: -color0 COLOR — Set palette color 0 (black).
color0 = "#000000"

# CLI: -color1 COLOR — Set palette color 1 (red).
color1 = "#cd0000"

# CLI: -color2 COLOR — Set palette color 2 (green).
color2 = "#00cd00"

# CLI: -color3 COLOR — Set palette color 3 (yellow).
color3 = "#cdcd00"

# CLI: -color4 COLOR — Set palette color 4 (blue).
color4 = "#0000ee"

# CLI: -color5 COLOR — Set palette color 5 (magenta).
color5 = "#cd00cd"

# CLI: -color6 COLOR — Set palette color 6 (cyan).
color6 = "#00cdcd"

# CLI: -color7 COLOR — Set palette color 7 (light gray).
color7 = "#e5e5e5"

# CLI: -color8 COLOR — Set palette color 8 (dark gray).
color8 = "#7f7f7f"

# CLI: -color9 COLOR — Set palette color 9 (bright red).
color9 = "#ff0000"

# CLI: -color10 COLOR — Set palette color 10 (bright green).
color10 = "#00ff00"

# CLI: -color11 COLOR — Set palette color 11 (bright yellow).
color11 = "#ffff00"

# CLI: -color12 COLOR — Set palette color 12 (bright blue).
color12 = "#5c5cff"

# CLI: -color13 COLOR — Set palette color 13 (bright magenta).
color13 = "#ff00ff"

# CLI: -color14 COLOR — Set palette color 14 (bright cyan).
color14 = "#00ffff"

# CLI: -color15 COLOR — Set palette color 15 (bright white).
color15 = "#ffffff"
