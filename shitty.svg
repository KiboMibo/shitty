<?xml version="1.0" encoding="UTF-8"?>
<!-- Shitty's icon: the name, taken at its word, in amber CRT phosphor -
     a terminal-faced pile with block-cursor eyes on the macOS icon grid
     (824px tile on a 1024px canvas). The build renders it to PNG with
     rsvg-convert and embeds the bytes as the Dock icon. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e26"/>
      <stop offset="0.55" stop-color="#111318"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="poo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="core" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="112" y="124" width="800" height="800" rx="182" fill="#000000" opacity="0.35" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="102.5" y="102.5" width="819" height="819" rx="184" fill="none" stroke="url(#edge)" stroke-width="5"/>

  <!-- the pile, glowing -->
<g filter="url(#halo)" opacity="0.55">
    <path d="M 480 420
             C 450 340 520 275 620 265
             C 570 300 560 330 585 365
             C 615 405 590 440 545 450
             C 510 458 490 445 480 420 Z" fill="#ffb000"/>
    <ellipse cx="512" cy="470" rx="145" ry="85" fill="#ffb000"/>
    <ellipse cx="512" cy="580" rx="215" ry="100" fill="#ffb000"/>
    <rect x="235" y="600" width="554" height="185" rx="92" fill="#ffb000"/>
  </g>
  <g filter="url(#core)" opacity="0.5">
    <path d="M 480 420
             C 450 340 520 275 620 265
             C 570 300 560 330 585 365
             C 615 405 590 440 545 450
             C 510 458 490 445 480 420 Z" fill="#ffb000"/>
    <ellipse cx="512" cy="470" rx="145" ry="85" fill="#ffb000"/>
    <ellipse cx="512" cy="580" rx="215" ry="100" fill="#ffb000"/>
    <rect x="235" y="600" width="554" height="185" rx="92" fill="#ffb000"/>
  </g>
  <g id="pile-shapes">
    <path d="M 480 420
             C 450 340 520 275 620 265
             C 570 300 560 330 585 365
             C 615 405 590 440 545 450
             C 510 458 490 445 480 420 Z" fill="url(#poo)"/>
    <ellipse cx="512" cy="470" rx="145" ry="85" fill="url(#poo)"/>
    <ellipse cx="512" cy="580" rx="215" ry="100" fill="url(#poo)"/>
    <rect x="235" y="600" width="554" height="185" rx="92" fill="url(#poo)"/>
  </g>

  <!-- terminal face: block-cursor eyes, underscore mouth -->
  <rect x="392" y="628" width="56" height="76" rx="10" fill="#0a0b0e"/>
  <rect x="576" y="628" width="56" height="76" rx="10" fill="#0a0b0e"/>
  <rect x="462" y="726" width="100" height="26" rx="10" fill="#0a0b0e"/>
</svg>
