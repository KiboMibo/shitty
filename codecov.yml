codecov:
  branch: master

coverage:
  precision: 2
  round: down
  range: "50...90"
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        informational: true
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: true
        if_ci_failed: error

comment:
  layout: "reach, diff, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true

ignore:
  - "tests/**/*"
  - "third_party/libstd/**/*"
  - "**/*_ut.cpp"
  - "test_mode.cpp"
  - "test_mode.h"
  - "test_input.cpp"
  - "test_input.h"
