codecov:
  branch: master

coverage:
  precision: 2
  round: down
  range: "50...90"
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        informational: true
        if_ci_failed: error
    patch: off

component_management:
  individual_components:
    - component_id: core
      name: core
      paths:
        - "**"
        - "!third_party/plt/platform_wayland.*"
        - "!render_vk.*"
      statuses:
        - type: patch
          target: 80%
          threshold: 0%
          informational: false
          if_ci_failed: error
    - component_id: platform-wayland
      name: platform-wayland
      paths:
        - "third_party/plt/platform_wayland.*"
    - component_id: renderer-vulkan
      name: renderer-vulkan
      paths:
        - "render_vk.*"

comment:
  layout: "reach, diff, files, components"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true

ignore:
  - "tests/**/*"
  - "third_party/libstd/**/*"
  - "**/*_ut.cpp"
  - "test_mode.cpp"
  - "test_mode.h"
  - "test_input.cpp"
  - "test_input.h"
