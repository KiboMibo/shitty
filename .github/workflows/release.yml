name: Release

# The release button: builds and tests both supported platforms from the
# current master, then publishes the next numeric tag after all four jobs have
# succeeded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (empty picks the next number)
        required: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out IX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/ix
          ref: 2fcf7eb9d685db76ee6c5a490b3fa032ec3f6b14
          path: .ix

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autopoint binutils bison bzip2 ca-certificates clang cmake curl file flex gettext \
            git glslang-tools gperf gzip libclang-rt-dev librsvg2-bin \
            lld llvm m4 make meson ninja-build perl pkg-config python3 ragel rsync xz-utils

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Linux binaries through IX
        env:
          IX_FLAGS: all_system=1,intl_ver=no,system_aclocal_path=/usr/share/aclocal
          IX_ROOT: ${{ runner.temp }}/ix
          IX_THREADS: 4
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/linux-build-diagnostics"
          .ix/ix run \
            --target=x86_64-linux \
            --libdlfcn_ver=elf \
            bld/compiler \
            bin/clang/env \
            lib/c \
            lib/c++ \
            lib/freetype \
            lib/fontconfig \
            lib/harfbuzz \
            lib/brotli \
            lib/simd/utf \
            lib/linux/headers \
            lib/wayland \
            lib/wayland/dl \
            lib/xkb/common \
            lib/vulkan/loader \
            lib/vulkan/headers \
            bld/wayland \
            bin/ragel/6 \
            bin/glslang \
            -- \
            dev/build_release_linux.sh \
              "$RUNNER_TEMP/build-linux" \
              "$RUNNER_TEMP/linux-build-diagnostics" \
            2>&1 \
            | tee "$RUNNER_TEMP/linux-build-diagnostics/build.log" \
            | python3 dev/prefix_timestamps.py

      - name: Upload Linux build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build-diagnostics
          path: ${{ runner.temp }}/linux-build-diagnostics/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Stage Linux binaries
        run: |
          mkdir -p "$RUNNER_TEMP/linux-x86_64"
          for binary in st pt; do
            cp -L "$RUNNER_TEMP/build-linux/$binary" "$RUNNER_TEMP/linux-x86_64/$binary"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-linux-alpine:
    name: Test Linux artifact on Alpine
    needs: build-linux
    runs-on: ubuntu-26.04
    container: alpine:3.24
    timeout-minutes: 15
    steps:
      - name: Install release test dependencies
        run: |
          apk add --no-cache \
            binutils coreutils file gcompat git mesa-vulkan-swrast \
            weston weston-backend-x11 xvfb

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Test Linux artifact
        run: sh dev/test_release_linux.sh "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-test-logs-alpine
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  test-linux-fedora:
    name: Test Linux artifact on Fedora
    needs: build-linux
    runs-on: ubuntu-26.04
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Install release test dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False \
            --setopt=retries=10 --setopt=timeout=60 --setopt=zchunk=False \
            install \
            binutils coreutils file mesa-vulkan-drivers weston xorg-x11-server-Xvfb

      - name: Test Linux artifact
        run: sh dev/test_release_linux.sh "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-test-logs-fedora
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  test-linux-ubuntu:
    name: Test Linux artifact on Ubuntu
    needs: build-linux
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Install release test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils coreutils file mesa-vulkan-drivers weston xvfb

      - name: Test Linux artifact
        run: sh dev/test_release_linux.sh "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-test-logs-ubuntu
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  build-darwin:
    name: Build Darwin artifacts
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          brew install llvm ragel glslang spirv-cross librsvg
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Build Darwin binaries
        run: dev/build_brew_macos.sh

      - name: Stage Darwin binaries
        run: |
          mkdir -p "$RUNNER_TEMP/darwin-arm64"
          cp -L .build-darwin/st .build-darwin/pt "$RUNNER_TEMP/darwin-arm64/"

      - name: Upload Darwin artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/darwin-arm64/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Package Darwin app bundles
        run: dev/package_darwin_apps.sh .build-darwin "$RUNNER_TEMP/darwin-app" "$RUNNER_TEMP/darwin-app-zip"

      - name: Upload Darwin app bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64-apps
          path: ${{ runner.temp }}/darwin-app-zip/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-darwin:
    name: Test Darwin artifacts
    needs: build-darwin
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Download Darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/darwin-arm64

      - name: Verify Darwin binaries
        run: |
          chmod +x "$RUNNER_TEMP/darwin-arm64/st" "$RUNNER_TEMP/darwin-arm64/pt"
          prefix="$(brew --prefix)"
          for binary in st pt; do
            path="$RUNNER_TEMP/darwin-arm64/$binary"
            file "$path"
            file "$path" | grep -q 'Mach-O 64-bit executable arm64'
            if otool -L "$path" | grep -Fq "$prefix"; then
              echo "release binary links Homebrew dylibs: $binary" >&2
              otool -L "$path" >&2
              exit 1
            fi
          done
          "$RUNNER_TEMP/darwin-arm64/st" -version | grep -q '^Shitty '
          "$RUNNER_TEMP/darwin-arm64/pt" -version | grep -q '^Pretty '

      - name: Test Metal through Cocoa
        run: |
          python3 - "$RUNNER_TEMP/darwin-arm64/st" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              [
                  sys.argv[1],
                  "-geometry", "20x5",
                  "-e", "/bin/sh", "-c",
                  'printf "Metal Cocoa smoke\\n"; sleep 2',
              ],
              check=True,
              timeout=30,
          )
          PY

  package-release:
    name: Package and publish release
    needs:
      - build-linux
      - test-linux-alpine
      - test-linux-fedora
      - test-linux-ubuntu
      - build-darwin
      - test-darwin
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/release-input/linux-x86_64

      - name: Download Darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/release-input/darwin-arm64

      - name: Download Darwin app bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64-apps
          path: ${{ runner.temp }}/release-input/darwin-apps

      - name: Let the release push tags
        run: |
          git config --global user.name "shitty release bot"
          git config --global user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create draft release
        run: |
          python3 dev/release.py ${{ inputs.tag }} --sha "$GITHUB_SHA" --generate-notes \
            --artifacts-directory "$RUNNER_TEMP/release-artifacts" --draft \
            --tag-file "$RUNNER_TEMP/release-tag" \
            --linux-binaries-directory "$RUNNER_TEMP/release-input/linux-x86_64" \
            --darwin-binaries-directory "$RUNNER_TEMP/release-input/darwin-arm64" \
            --darwin-apps-directory "$RUNNER_TEMP/release-input/darwin-apps"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # dev/release.py copies the Darwin app zips into the same
          # artifacts directory as the tar.gz archives, so both patterns are
          # needed to attest everything gh release create attaches.
          subject-path: |
            ${{ runner.temp }}/release-artifacts/*.tar.gz
            ${{ runner.temp }}/release-artifacts/*.zip

      - name: Publish release
        run: gh release edit "$(cat "$RUNNER_TEMP/release-tag")" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
