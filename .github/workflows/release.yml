name: Release

# The release button: builds both supported platforms from the current master,
# then publishes the next numeric tag after both builds have succeeded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (empty picks the next number)
        required: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  linux:
    name: Build Linux artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out IX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/ix
          ref: c93d283145781ced2cbd5becbcfe62d70d7b07c9
          path: .ix

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autopoint binutils bison bzip2 ca-certificates clang cmake curl file flex gettext \
            git glslang-tools gperf gzip libclang-rt-dev librsvg2-bin \
            lld llvm m4 make mesa-vulkan-drivers meson ninja-build perl pkg-config python3 ragel \
            rsync weston xz-utils

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Linux binaries through IX
        env:
          CC: clang
          CXX: clang++
          IX_FLAGS: all_system=1,intl_ver=no,system_aclocal_path=/usr/share/aclocal
          IX_ROOT: ${{ runner.temp }}/ix
          IX_THREADS: 4
        run: |
          .ix/ix run \
            --target=x86_64-linux \
            --libdlfcn_ver=elf \
            bld/compiler \
            bin/clang/env \
            lib/c \
            lib/c++ \
            lib/freetype \
            lib/fontconfig \
            lib/harfbuzz \
            lib/brotli \
            lib/simd/utf \
            lib/linux/headers \
            lib/wayland \
            lib/wayland/dl \
            lib/xkb/common \
            lib/vulkan/loader \
            lib/vulkan/headers \
            bld/wayland \
            bin/ragel/6 \
            bin/glslang \
            -- \
            ./build --target=x86_64-linux -B "$RUNNER_TEMP/build-linux" st pt

      - name: Verify Linux binaries
        run: |
          mkdir -p "$RUNNER_TEMP/linux-x86_64"
          for binary in st pt; do
            file -L "$RUNNER_TEMP/build-linux/$binary"
            file -L "$RUNNER_TEMP/build-linux/$binary" | grep -q 'ELF 64-bit LSB executable, x86-64'
            ! readelf -lW "$RUNNER_TEMP/build-linux/$binary" | grep -q INTERP
            ! readelf -dW "$RUNNER_TEMP/build-linux/$binary" | grep -q NEEDED
            cp -L "$RUNNER_TEMP/build-linux/$binary" "$RUNNER_TEMP/linux-x86_64/$binary"
          done

      - name: Test Vulkan through Wayland
        run: |
          set -o pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          export WAYLAND_DISPLAY=wayland-shitty-test
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          export DL_STUB_DEBUG="$RUNNER_TEMP/dlfcn.log"

          test -n "$VK_DRIVER_FILES"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          weston \
            --backend=headless-backend.so \
            --renderer=pixman \
            --no-config \
            --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 \
            --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true' EXIT

          for attempt in {1..100}; do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then
              break
            fi
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/weston.log"
              exit 1
            fi
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"

          WAYLAND_DEBUG=client timeout 30 "$RUNNER_TEMP/build-linux/st" \
            -vulkanInfo \
            -geometry 20x5 \
            -e /bin/sh -c 'printf "Vulkan Wayland smoke\n"; sleep 2' \
            2>&1 | tee "$RUNNER_TEMP/vulkan-wayland.log"

          grep -q '^Vulkan device: llvmpipe' "$RUNNER_TEMP/vulkan-wayland.log"
          grep -q '^Vulkan presentation:' "$RUNNER_TEMP/vulkan-wayland.log"
          grep -Eq 'wl_surface[#@][0-9]+\.attach\(wl_buffer[#@][0-9]+' "$RUNNER_TEMP/vulkan-wayland.log"
          grep -q 'try open handle libwayland-client.so.0' "$DL_STUB_DEBUG"
          grep -q 'found handle wayland-client' "$DL_STUB_DEBUG"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  darwin:
    name: Build Darwin artifacts
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          brew install llvm ragel glslang spirv-cross librsvg
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Build Darwin binaries
        run: dev/build_brew_macos.sh

      - name: Upload Darwin artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64
          path: |
            .build-darwin/st
            .build-darwin/pt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish release
    needs:
      - linux
      - darwin
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/release-input/linux-x86_64

      - name: Download Darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/release-input/darwin-arm64

      - name: Let the release push tags
        run: |
          git config --global user.name "shitty release bot"
          git config --global user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create draft release
        run: |
          python3 dev/release.py ${{ inputs.tag }} --sha "$GITHUB_SHA" --generate-notes \
            --artifacts-directory "$RUNNER_TEMP/release-artifacts" --draft \
            --tag-file "$RUNNER_TEMP/release-tag" \
            --linux-binaries-directory "$RUNNER_TEMP/release-input/linux-x86_64" \
            --darwin-binaries-directory "$RUNNER_TEMP/release-input/darwin-arm64"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/release-artifacts/*.tar.gz'

      - name: Publish release
        run: gh release edit "$(cat "$RUNNER_TEMP/release-tag")" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
