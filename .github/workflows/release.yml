name: Release

# The release button: builds and tests both supported platforms from the
# current master, then publishes the next numeric tag after all four jobs have
# succeeded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (empty picks the next number)
        required: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out IX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/ix
          ref: abc5f92caa99edacc5228b283a50fd7330006498
          path: .ix

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autopoint binutils bison bzip2 ca-certificates clang cmake curl file flex gettext \
            git glslang-tools gperf gzip libclang-rt-dev librsvg2-bin \
            lld llvm m4 make meson ninja-build perl pkg-config python3 ragel rsync xz-utils

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Linux binaries through IX
        env:
          IX_FLAGS: all_system=1,intl_ver=no,system_aclocal_path=/usr/share/aclocal
          IX_ROOT: ${{ runner.temp }}/ix
          IX_THREADS: 4
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/linux-build-diagnostics"
          .ix/ix run \
            --target=x86_64-linux \
            --libdlfcn_ver=elf \
            bld/compiler \
            bin/clang/env \
            lib/c \
            lib/c++ \
            lib/freetype \
            lib/fontconfig \
            lib/harfbuzz \
            lib/brotli \
            lib/simd/utf \
            lib/linux/headers \
            lib/wayland \
            lib/wayland/dl \
            lib/xkb/common \
            lib/vulkan/loader \
            lib/vulkan/headers \
            bld/wayland \
            bin/ragel/6 \
            bin/glslang \
            -- \
            dev/build_release_linux.sh \
              "$RUNNER_TEMP/build-linux" \
              "$RUNNER_TEMP/linux-build-diagnostics" \
            2>&1 \
            | tee "$RUNNER_TEMP/linux-build-diagnostics/build.log" \
            | python3 dev/prefix_timestamps.py

      - name: Upload Linux build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build-diagnostics
          path: ${{ runner.temp }}/linux-build-diagnostics/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Stage Linux binaries
        run: |
          mkdir -p "$RUNNER_TEMP/linux-x86_64"
          for binary in st pt; do
            cp -L "$RUNNER_TEMP/build-linux/$binary" "$RUNNER_TEMP/linux-x86_64/$binary"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-linux:
    name: Test Linux artifacts
    needs: build-linux
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Install release test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils file mesa-vulkan-drivers weston xvfb

      - name: Verify Linux binaries
        run: |
          chmod +x "$RUNNER_TEMP/linux-x86_64/st" "$RUNNER_TEMP/linux-x86_64/pt"
          for binary in st pt; do
            path="$RUNNER_TEMP/linux-x86_64/$binary"
            file -L "$path"
            file -L "$path" | grep -q 'ELF 64-bit LSB executable, x86-64'
            ! readelf -lW "$path" | grep -q INTERP
            ! readelf -dW "$path" | grep -q NEEDED
          done
          "$RUNNER_TEMP/linux-x86_64/st" -version | grep -q '^Shitty '
          "$RUNNER_TEMP/linux-x86_64/pt" -version | grep -q '^Pretty '

      - name: Test Vulkan through Wayland
        run: |
          set -o pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          export WAYLAND_DISPLAY=wayland-shitty-test
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          export DL_STUB_DEBUG="$RUNNER_TEMP/dlfcn.log"

          test -n "$VK_DRIVER_FILES"
          install -d -m 700 "$XDG_RUNTIME_DIR"

          display_file="$RUNNER_TEMP/xvfb-display"
          Xvfb \
            -displayfd 3 \
            -screen 0 1024x768x24 \
            -nolisten tcp \
            3>"$display_file" &
          xvfb_pid=$!
          for attempt in {1..100}; do
            if test -s "$display_file"; then
              break
            fi
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 0.1
          done
          test -s "$display_file"
          export DISPLAY=":$(cat "$display_file")"

          weston \
            --backend=x11-backend.so \
            --renderer=pixman \
            --no-config \
            --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 \
            --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          cleanup() {
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
            kill "$xvfb_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..100}; do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then
              break
            fi
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/weston.log"
              exit 1
            fi
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"

          WAYLAND_DEBUG=client timeout 30 "$RUNNER_TEMP/linux-x86_64/st" \
            -vulkanInfo \
            -geometry 20x5 \
            -e /bin/sh -c 'printf "Vulkan Wayland smoke\n"; sleep 2' \
            2>&1 | tee "$RUNNER_TEMP/vulkan-wayland.log"

          grep -q '^Vulkan device: llvmpipe' "$RUNNER_TEMP/vulkan-wayland.log"
          grep -q '^Vulkan presentation:' "$RUNNER_TEMP/vulkan-wayland.log"
          grep -Eq 'wl_surface[#@][0-9]+\.attach\(wl_buffer[#@][0-9]+' "$RUNNER_TEMP/vulkan-wayland.log"
          grep -q 'try open handle libwayland-client.so.0' "$DL_STUB_DEBUG"
          grep -q 'found handle wayland-client' "$DL_STUB_DEBUG"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-test-logs
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  build-darwin:
    name: Build Darwin artifacts
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          brew install llvm ragel glslang spirv-cross librsvg
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Build Darwin binaries
        run: dev/build_brew_macos.sh

      - name: Stage Darwin binaries
        run: |
          mkdir -p "$RUNNER_TEMP/darwin-arm64"
          cp -L .build-darwin/st .build-darwin/pt "$RUNNER_TEMP/darwin-arm64/"

      - name: Upload Darwin artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/darwin-arm64/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-darwin:
    name: Test Darwin artifacts
    needs: build-darwin
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Download Darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/darwin-arm64

      - name: Verify Darwin binaries
        run: |
          chmod +x "$RUNNER_TEMP/darwin-arm64/st" "$RUNNER_TEMP/darwin-arm64/pt"
          prefix="$(brew --prefix)"
          for binary in st pt; do
            path="$RUNNER_TEMP/darwin-arm64/$binary"
            file "$path"
            file "$path" | grep -q 'Mach-O 64-bit executable arm64'
            if otool -L "$path" | grep -Fq "$prefix"; then
              echo "release binary links Homebrew dylibs: $binary" >&2
              otool -L "$path" >&2
              exit 1
            fi
          done
          "$RUNNER_TEMP/darwin-arm64/st" -version | grep -q '^Shitty '
          "$RUNNER_TEMP/darwin-arm64/pt" -version | grep -q '^Pretty '

      - name: Test Metal through Cocoa
        run: |
          python3 - "$RUNNER_TEMP/darwin-arm64/st" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              [
                  sys.argv[1],
                  "-geometry", "20x5",
                  "-e", "/bin/sh", "-c",
                  'printf "Metal Cocoa smoke\\n"; sleep 2',
              ],
              check=True,
              timeout=30,
          )
          PY

  package-release:
    name: Package and publish release
    needs:
      - build-linux
      - test-linux
      - build-darwin
      - test-darwin
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/release-input/linux-x86_64

      - name: Download Darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/release-input/darwin-arm64

      - name: Let the release push tags
        run: |
          git config --global user.name "shitty release bot"
          git config --global user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create draft release
        run: |
          python3 dev/release.py ${{ inputs.tag }} --sha "$GITHUB_SHA" --generate-notes \
            --artifacts-directory "$RUNNER_TEMP/release-artifacts" --draft \
            --tag-file "$RUNNER_TEMP/release-tag" \
            --linux-binaries-directory "$RUNNER_TEMP/release-input/linux-x86_64" \
            --darwin-binaries-directory "$RUNNER_TEMP/release-input/darwin-arm64"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/release-artifacts/*.tar.gz'

      - name: Publish release
        run: gh release edit "$(cat "$RUNNER_TEMP/release-tag")" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
