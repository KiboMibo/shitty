name: Release

# The release button: publishes the next numeric tag from the current
# master with portable st and pt binaries for darwin-arm64 and Linux x86-64.
# The Darwin archives contain no Homebrew dylibs; dev/build_brew_macos.sh
# guards that. The homebrew tap picks the release up on its own schedule.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (empty picks the next number)
        required: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  linux:
    name: Build Linux artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake autopoint bison bzip2 ca-certificates clang cmake curl file flex gettext \
            git glslang-tools gperf gzip libclang-rt-dev librsvg2-bin libtool libwayland-bin \
            lld llvm m4 make meson ninja-build perl pkg-config python3 ragel \
            rsync xz-utils

      - name: Build static Linux binaries
        env:
          SHITTY_LINUX_OUTPUT: ${{ runner.temp }}/release-artifacts
          SHITTY_LINUX_SOURCE_CACHE: ${{ runner.temp }}/source-cache
        run: dev/build_linux_static.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/release-artifacts/*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: linux
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/release-artifacts
      - name: Install the toolchain
        run: |
          brew install llvm ragel glslang spirv-cross librsvg
          command -v pkg-config >/dev/null || brew install pkgconf
      - name: Let the release push tags
        run: |
          git config --global user.name "shitty release bot"
          git config --global user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build draft release
        run: |
          python3 dev/release.py ${{ inputs.tag }} --sha "$GITHUB_SHA" --builder brew --generate-notes \
            --artifacts-directory "$RUNNER_TEMP/release-artifacts" --draft \
            --tag-file "$RUNNER_TEMP/release-tag" \
            --extra-artifact "$RUNNER_TEMP/release-artifacts/st-linux-x86_64.tar.gz" \
            --extra-artifact "$RUNNER_TEMP/release-artifacts/pt-linux-x86_64.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/release-artifacts/*.tar.gz'
      - name: Publish release
        run: gh release edit "$(cat "$RUNNER_TEMP/release-tag")" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
