name: Validate Sandy Bridge Linux

on:
  push:
    branches:
      - fix/sandybridge-linux-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out IX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/ix
          ref: a70273d7892f51a4a7ff2413be1ade97fa0a4c54
          path: .ix

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autopoint binutils bison bzip2 ca-certificates clang cmake curl \
            file flex gettext git glslang-tools gperf gzip libclang-rt-dev \
            librsvg2-bin lld llvm m4 make meson ninja-build perl pkg-config \
            python3 ragel rsync xz-utils coreutils mesa-vulkan-drivers \
            weston xvfb

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build portable Linux binaries through IX
        env:
          IX_FLAGS: "all_system=1,intl_ver=no,\
            system_aclocal_path=/usr/share/aclocal,cflags=-march=x86-64"
          IX_ROOT: ${{ runner.temp }}/ix
          IX_THREADS: 4
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/linux-build-diagnostics"
          .ix/ix run \
            --target=x86_64-linux \
            --libdlfcn_ver=elf \
            bld/compiler \
            bin/clang/env \
            lib/c \
            lib/c++ \
            lib/freetype \
            lib/fontconfig \
            lib/harfbuzz \
            lib/brotli \
            lib/simd/utf \
            lib/linux/headers \
            lib/wayland \
            lib/wayland/dl \
            lib/xkb/common \
            lib/vulkan/loader \
            lib/vulkan/headers \
            bld/wayland \
            bin/ragel/6 \
            bin/glslang \
            -- \
            dev/build_release_linux.sh \
              "$RUNNER_TEMP/linux-x86_64" \
              "$RUNNER_TEMP/linux-build-diagnostics" \
            2>&1 | tee "$RUNNER_TEMP/linux-build-diagnostics/build.log"

      - name: Test Linux artifact
        run: |
          sh dev/test_release_linux.sh \
            "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux artifacts
        uses: "actions/upload-artifact@\
          043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: linux-x86_64-sandybridge
          path: ${{ runner.temp }}/linux-x86_64/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: "actions/upload-artifact@\
          043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: sandybridge-build-diagnostics
          path: ${{ runner.temp }}/linux-build-diagnostics/*
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9
