name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      darwin_tests:
        description: Run the Darwin build and test shards
        type: boolean
        default: false
      sandboxed:
        description: Audit declared build inputs under strace
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false

      - name: Build package
        run: |
          set -o pipefail
          nix build -L --no-link \
            .#checks.x86_64-linux.build \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build.log" \
            --title "Build Linux" \
            --reproduce "nix build -L --no-link .#checks.x86_64-linux.build"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests:
    name: Tests Linux
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false

      - name: Run full test suite
        run: |
          set -o pipefail
          nix build -L --no-link \
            .#checks.x86_64-linux.tests \
            2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests.log" \
            --title "Tests Linux" \
            --reproduce "nix build -L --no-link .#checks.x86_64-linux.tests"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-log
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-fedora:
    name: Tests Fedora
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stock Fedora toolchain
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            gcc-c++ make git python3 perl pkgconf-pkg-config diffutils procps-ng \
            ragel glslang librsvg2-tools ncurses-devel \
            freetype-devel fontconfig-devel harfbuzz-devel \
            libxkbcommon-devel utf8proc-devel \
            vulkan-headers vulkan-loader-devel mesa-vulkan-drivers \
            wayland-devel wayland-protocols-devel

      - name: Run full test suite with GCC and Ragel 7
        env:
          CC: gcc
          CXX: g++
        run: |
          set -o pipefail
          ./build test 2>&1 | tee "$RUNNER_TEMP/tests-fedora.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-fedora.log" \
            --title "Tests Fedora" \
            --reproduce "run the Tests Fedora steps from .github/workflows/ci.yml in a fedora:44 container"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-fedora-log
          path: ${{ runner.temp }}/tests-fedora.log
